apiVersion: v1
kind: ServiceAccount
metadata:
  name: warble-army-mcp
  namespace: warblecloud-ai
  labels:
    app.kubernetes.io/part-of: warble-army
---
# Read-only cluster access for SteadyHelm tools behind Starling Lite.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: warble-army-mcp-readonly
  labels:
    app.kubernetes.io/part-of: warble-army
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "pods/log", "nodes", "events", "services", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: warble-army-mcp-readonly
  labels:
    app.kubernetes.io/part-of: warble-army
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: warble-army-mcp-readonly
subjects:
  - kind: ServiceAccount
    name: warble-army-mcp
    namespace: warblecloud-ai

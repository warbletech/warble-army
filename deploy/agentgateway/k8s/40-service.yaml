apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: warblecloud-ai
  labels:
    app: agentgateway
    app.kubernetes.io/part-of: warble-army
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
spec:
  type: ClusterIP
  selector:
    app: agentgateway
  ports:
    # Existing clients used port 80 → container 8080 (nginx). Remap to agentgateway :3000.
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
    - name: mcp
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: admin
      port: 15000
      targetPort: 15000
      protocol: TCP
---
# Direct MCP (bypass gateway) for debugging
apiVersion: v1
kind: Service
metadata:
  name: starling-lite
  namespace: warblecloud-ai
  labels:
    app: agentgateway
    app.kubernetes.io/part-of: warble-army
spec:
  type: ClusterIP
  selector:
    app: agentgateway
  ports:
    - name: mcp
      port: 8822
      targetPort: 8822

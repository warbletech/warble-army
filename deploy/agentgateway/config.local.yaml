# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# Local Agent Gateway in front of Warble Army (Starling Lite MCP).
#
# Run:
#   make starling-lite && ./bin/starling-lite --transport=http --addr=:8822 \
#     --registry=mcp/tools/registry.json &
#   make agentgateway-local
#
# MCP:   http://127.0.0.1:3000/mcp
# Admin: http://127.0.0.1:15000/ui/
#
# Optional LLM routes: see config.local-with-llm.yaml (needs GEMINI_API_KEY).

config:
  logging:
    format: json
    level: info
  adminAddr: "0.0.0.0:15000"
  statsAddr: "0.0.0.0:15001"

binds:
  - port: 3000
    listeners:
      - routes:
          - matches:
              - path:
                  pathPrefix: /mcp
            backends:
              - mcp:
                  prefixMode: never
                  statefulMode: stateless
                  failureMode: failClosed
                  targets:
                    - name: warble-army
                      mcp:
                        host: 127.0.0.1
                        port: 8822
                        path: /mcp
            policies:
              cors:
                allowOrigins: ["*"]
                allowHeaders:
                  - mcp-protocol-version
                  - content-type
                  - cache-control
                  - mcp-session-id
                exposeHeaders:
                  - "Mcp-Session-Id"

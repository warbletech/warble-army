# Starling Lite always-on MCP — Railway
# https://github.com/warbletech/warble-army/tree/main/deploy/railway

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/railway/Dockerfile"
watchPatterns = [
  "mcp/starling-lite/**",
  # submodule bumps change the gitlink path itself, which "dir/**" does not match
  "heron-ops",
  "heron-ops/**",
  "shrikeops",
  "shrikeops/**",
  "mcp/tools/**",
  "deploy/railway/**",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

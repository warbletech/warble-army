name: check

# Runner selection (see docs/CI.md):
#   - warbletech pushes / same-repo PRs  -> org self-hosted runner `warble-ci`
#   - fork PRs and runs inside forks      -> GitHub-hosted `ubuntu-latest`
#     (untrusted fork code never runs on the self-hosted runner; hosted
#     minutes are free for public repos/forks)
# All submodules are public, so checkout uses github.token. WARBLE_CI_PAT is
# opt-in via repo variable CI_USE_PAT=true (only if a submodule goes private;
# forks never have it and fall back to github.token).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submodules-and-mcp:
    name: submodules
    runs-on: ${{ (github.repository_owner == 'warbletech' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'warble-ci' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      # Submodules are public; the PAT is opt-in (vars.CI_USE_PAT), forks never need it.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ vars.CI_USE_PAT == 'true' && secrets.WARBLE_CI_PAT || github.token }}

      - name: Submodule status
        run: ./scripts/submodules.sh status

      - name: MCP registry
        run: ./scripts/check-mcp-registry.sh

  build-starling-lite:
    name: starling-lite
    runs-on: ${{ (github.repository_owner == 'warbletech' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'warble-ci' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ vars.CI_USE_PAT == 'true' && secrets.WARBLE_CI_PAT || github.token }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            mcp/starling-lite/go.sum
            heron-ops/go.sum
            shrikeops/scanner/go.sum

      # Same pinned versions as deploy/railway/Dockerfile and the ShrikeOps README.
      - name: Install ShrikeOps scanners (pluto, polaris, kube-score)
        env:
          PLUTO_VERSION: "5.24.4"
          POLARIS_VERSION: "10.2.5"
          KUBE_SCORE_VERSION: "1.20.0"
        run: |
          set -euo pipefail
          BIN_DIR="${RUNNER_TEMP}/scanners"
          mkdir -p "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$BIN_DIR:$PATH"
          curl -fsSL "https://github.com/FairwindsOps/pluto/releases/download/v${PLUTO_VERSION}/pluto_${PLUTO_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$BIN_DIR" pluto
          curl -fsSL "https://github.com/FairwindsOps/polaris/releases/download/v${POLARIS_VERSION}/polaris_${POLARIS_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$BIN_DIR" polaris
          curl -fsSL "https://github.com/zegl/kube-score/releases/download/v${KUBE_SCORE_VERSION}/kube-score_${KUBE_SCORE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$BIN_DIR" kube-score
          pluto version && polaris version && kube-score version

      - name: Build Heron Ops
        run: |
          mkdir -p bin
          (cd heron-ops && go build -o ../bin/heron-ops .)
          ln -sfn heron-ops bin/steadyhelm

      - name: Build Starling Lite
        run: |
          cd mcp/starling-lite
          go mod tidy
          go vet ./...
          go test -count=1 ./...
          go build -o ../../bin/starling-lite ./cmd/starling-lite

      - name: MCP tools/list smoke
        run: |
          set -euo pipefail
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","clientInfo":{"name":"ci","version":"0"},"capabilities":{}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | ./bin/starling-lite \
                --mode=readonly \
                --transport=stdio \
                --registry="${GITHUB_WORKSPACE}/mcp/tools/registry.json" \
            2>/tmp/sl.err \
            | tee /tmp/sl.out
          python3 - <<'PY'
          import json,sys
          tools=None
          for line in open("/tmp/sl.out"):
              line=line.strip()
              if not line: continue
              r=json.loads(line)
              if r.get("id")==2:
                  tools=r["result"]["tools"]
          assert tools is not None, "no tools/list response"
          # readonly: write tools filtered
          names={t["name"] for t in tools}
          assert "scan_manifest" in names, names
          assert "cluster_summary" in names, names
          assert "propose_remediation" in names, names
          assert "scale_deployment" not in names, "write tools should be hidden in readonly"
          print(f"ok tools/list count={len(tools)}")
          PY

      - name: scan_manifest smoke (demo YAML)
        run: |
          set -euo pipefail
          MANIFEST="${GITHUB_WORKSPACE}/shrikeops-demo/k8s/bad/root-container.yaml"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","clientInfo":{"name":"ci","version":"0"},"capabilities":{}}}' \
            "{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"tools/call\",\"params\":{\"name\":\"scan_manifest\",\"arguments\":{\"path\":\"${MANIFEST}\",\"source\":\"root-container.yaml\"}}}" \
            | ./bin/starling-lite \
                --mode=readonly \
                --transport=stdio \
                --registry="${GITHUB_WORKSPACE}/mcp/tools/registry.json" \
            2>/tmp/scan.err \
            | tee /tmp/scan.out
          python3 - <<'PY'
          import json
          for line in open("/tmp/scan.out"):
              line=line.strip()
              if not line: continue
              r=json.loads(line)
              if r.get("id")!=3: continue
              assert not r.get("error"), r
              text=r["result"]["content"][0]["text"]
              report=json.loads(text)
              assert "score" in report and "findings" in report, report.keys()
              # scanners are installed above, so the scan must be complete (graded)
              assert report.get("incomplete") is False, report.get("warning")
              print("ok scan_manifest source=", report.get("source"),
                    "grade=", report.get("score",{}).get("grade"),
                    "findings=", len(report.get("findings") or []))
              break
          else:
              raise SystemExit("no tools/call response")
          PY

      - name: Upload binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: warble-army-bin
          path: |
            bin/starling-lite
            bin/heron-ops
          retention-days: 7

  reflexion-agent:
    name: reflexion
    runs-on: ${{ (github.repository_owner == 'warbletech' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'warble-ci' || 'ubuntu-latest' }}
    needs: build-starling-lite
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ vars.CI_USE_PAT == 'true' && secrets.WARBLE_CI_PAT || github.token }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: mcp/starling-lite/go.sum

      - name: Build Starling Lite
        run: |
          mkdir -p bin
          cd mcp/starling-lite && go mod tidy && go build -o ../../bin/starling-lite ./cmd/starling-lite

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Reflexion agent over HTTP MCP
        run: |
          set -euo pipefail
          ./bin/starling-lite \
            --mode=readonly \
            --transport=http \
            --addr=127.0.0.1:8822 \
            --registry="${GITHUB_WORKSPACE}/mcp/tools/registry.json" \
            >/tmp/sl-http.log 2>&1 &
          echo $! > /tmp/sl.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8822/health && break
            sleep 0.5
          done
          python3 agents/reflexion/run.py \
            --mcp http://127.0.0.1:8822/mcp \
            --path shrikeops-demo/k8s/bad/root-container.yaml
          kill "$(cat /tmp/sl.pid)" 2>/dev/null || true

  project-sandbox-chart:
    name: project-sandbox chart
    runs-on: ${{ (github.repository_owner == 'warbletech' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'warble-ci' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint + render + invariants
        run: ./scripts/ci/test-project-sandbox.sh

name: scorecard

# OpenSSF Scorecard. Runs only while the repo is public: hosted runners and
# code-scanning SARIF upload are free for public repos (no Advanced Security
# seat needed). publish_results requires GitHub-hosted runners, so this job
# intentionally stays on ubuntu-latest and never runs on forks.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: github.repository == 'warbletech/warble-army' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results / badge
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

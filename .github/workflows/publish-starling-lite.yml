name: Publish starling-lite image

# Build deploy/agentgateway/Dockerfile.starling-lite (port 8822, the chart
# image) and push one immutable tag to GHCR:
#
#   ghcr.io/warbletech/warble-army/starling-lite:<full git commit SHA>
#
# Pull requests build only. A push to main that touches the image inputs,
# or a manual run, also pushes that SHA. The image built in this run is
# saved and pushed by a separate job, so packages: write is not granted
# on pull requests. This workflow does not push :latest and does not call
# the package visibility API. GITHUB_TOKEN can create a private package.
# Anonymous pull stays blocked until an org owner makes the package public.
#
# starling-lite-vX.Y.Z release tags are not a trigger here. release.yml
# publishes ghcr.io/warbletech/warble-army/starling-lite:X.Y.Z for those.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/agentgateway/Dockerfile.starling-lite"
      - "mcp/starling-lite/**"
      - "heron-ops"
      - "heron-ops/**"
      - "shrikeops"
      - "shrikeops/**"
      - "mcp/tools/**"
      - ".github/workflows/publish-starling-lite.yml"
  push:
    branches: [main]
    paths:
      - "deploy/agentgateway/Dockerfile.starling-lite"
      - "mcp/starling-lite/**"
      - "heron-ops"
      - "heron-ops/**"
      - "shrikeops"
      - "shrikeops/**"
      - "mcp/tools/**"
      - ".github/workflows/publish-starling-lite.yml"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/warbletech/warble-army/starling-lite

jobs:
  build:
    name: build starling-lite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ vars.CI_USE_PAT == 'true' && secrets.WARBLE_CI_PAT || github.token }}

      - name: Build
        run: docker build -f deploy/agentgateway/Dockerfile.starling-lite -t "${IMAGE}:${{ github.sha }}" .

      - name: Save image for publish
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          set -euo pipefail
          mkdir -p image-export
          docker save "${IMAGE}:${{ github.sha }}" -o image-export/starling-lite.tar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          name: starling-lite-image
          path: image-export/starling-lite.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: push starling-lite
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # docker push to ghcr.io
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: starling-lite-image
          path: image-export

      - name: Push git SHA tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker load -i image-export/starling-lite.tar
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker push "${IMAGE}:${{ github.sha }}"
          echo "pushed ${IMAGE}:${{ github.sha }}"
          echo "visibility was not changed; anonymous pull is not granted by this job"

name: Publish Helm charts

# Package charts/ and push them to GHCR.
# Pull name after publish: oci://ghcr.io/warbletech/charts/<chart>
# helm.registry.frakma.io is a DNS name for that registry. Its certificate
# does not cover the extra label yet, so this job pushes to ghcr.io.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/publish-charts.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: package and push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        run: |
          curl -fsSL -o /tmp/helm.tgz https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz
          tar -C /tmp -xzf /tmp/helm.tgz
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Package and push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p dist
          for chart in charts/*; do
            [ -f "$chart/Chart.yaml" ] || continue
            helm package "$chart" --destination dist
          done
          for tgz in dist/*.tgz; do
            helm push "$tgz" oci://ghcr.io/warbletech/charts
            echo "pushed $(basename "$tgz")"
          done

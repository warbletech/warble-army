name: dco

# Developer Certificate of Origin: every commit in a PR needs a
# "Signed-off-by:" trailer matching its author (git commit -s).
# No third-party app or secrets; read-only token.
on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: DCO sign-off
    # Fork PRs never touch the org's self-hosted runner.
    runs-on: ${{ (github.repository_owner == 'warbletech' && github.event.pull_request.head.repo.full_name == github.repository) && 'warble-ci' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: ${author}"; then
              echo "ok   ${sha:0:12} ${author}"
            else
              echo "::error::commit ${sha:0:12} by ${author} is missing 'Signed-off-by: ${author}'"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Fix with: git rebase --signoff ${BASE_SHA} && git push --force-with-lease (on your own branch)"
            exit 1
          fi

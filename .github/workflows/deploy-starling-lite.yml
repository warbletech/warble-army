name: deploy-starling-lite

# CD for the public Starling Lite MCP (https://mcp.warbleoss.org) on Railway.
#  - pull_request touching the service: build deploy/railway/Dockerfile and smoke the container.
#  - push to main touching the service (same paths as railway.toml watchPatterns) or a manual
#    run: the same checks, then `railway up` to production, then a production smoke test that
#    waits for /health to report this commit, checks tools/list, and requires scan_manifest to
#    be complete (not "incomplete").
#
# Needs (repo Settings -> Environments -> production):
#   secret   RAILWAY_TOKEN    Railway *project* token for the production environment
#   variable RAILWAY_SERVICE  Railway service name of Starling Lite (e.g. starling-lite)
#   variable MCP_URL          optional, default https://mcp.warbleoss.org
# Submodules are public, so checkout uses github.token. Set repo variable
# CI_USE_PAT=true to use secret WARBLE_CI_PAT instead (only if a submodule goes private).

on:
  push:
    branches: [main]
    paths:
      - "mcp/starling-lite/**"
      - "heron-ops"
      - "heron-ops/**"
      - "shrikeops"
      - "shrikeops/**"
      - "mcp/tools/**"
      - "deploy/railway/**"
      - "railway.toml"
      - "scripts/ci/starling-lite-smoke.py"
      - ".github/workflows/deploy-starling-lite.yml"
  pull_request:
    paths:
      - "mcp/starling-lite/**"
      - "heron-ops"
      - "heron-ops/**"
      - "shrikeops"
      - "shrikeops/**"
      - "mcp/tools/**"
      - "deploy/railway/**"
      - "railway.toml"
      - "scripts/ci/starling-lite-smoke.py"
      - ".github/workflows/deploy-starling-lite.yml"
      # PR-only: the demo-cluster manifests are tested below but never deployed from here.
      - "deploy/demo-cluster/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  RAILWAY_CLI_VERSION: "5.64.2"

jobs:
  image:
    name: Build image & container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ vars.CI_USE_PAT == 'true' && secrets.WARBLE_CI_PAT || github.token }}

      - name: Stamp revision
        run: echo "${GITHUB_SHA}" > deploy/railway/REVISION

      - name: Build deploy/railway/Dockerfile
        run: docker build -f deploy/railway/Dockerfile -t starling-lite:ci .

      - name: Smoke the container
        # No kubeconfig, like the public demo today: scan-only, cluster tools not listed.
        run: |
          set -euo pipefail
          docker run -d --name sl -e PORT=8080 -p 8080:8080 starling-lite:ci
          python3 scripts/ci/starling-lite-smoke.py --url http://127.0.0.1:8080 --revision "${GITHUB_SHA}" --wait 60

      - name: Local paths stay inside the empty scan root
        run: |
          set -euo pipefail
          for p in /etc/warble-army/registry.json ../etc/warble-army/registry.json; do
            body="{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"scan_manifest\",\"arguments\":{\"path\":\"$p\"}}}"
            out="$(curl -fsS -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8080/mcp)"
            echo "$out" | python3 -c 'import json,sys; r=json.load(sys.stdin)["result"]; assert r.get("isError"), r; print("refused:", r["content"][0]["text"][:120])'
          done

      # warble-marketing#80: the read-only identity in deploy/demo-cluster against a
      # throwaway kind cluster, then the same image with KUBECONFIG_B64 must answer
      # cluster_summary. Nothing here touches a real cluster or Railway.
      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: starling-demo

      - name: Apply deploy/demo-cluster/rbac.yaml and build the read-only kubeconfig
        run: |
          set -euo pipefail
          shellcheck deploy/demo-cluster/make-kubeconfig.sh
          # The shrikeops-demo samples create these namespaces; empty ones are enough here.
          for ns in demo broken-config broken-readiness broken-scheduling broken-hpa; do
            kubectl create namespace "$ns"
          done
          kubectl apply -f deploy/demo-cluster/rbac.yaml
          for _ in $(seq 30); do
            [ -n "$(kubectl -n starling-demo-reader get secret starling-lite-demo-token -o jsonpath='{.data.token}')" ] && break
            sleep 2
          done
          deploy/demo-cluster/make-kubeconfig.sh --context kind-starling-demo --out "${RUNNER_TEMP}/demo.kubeconfig"

      - name: Smoke the container with the demo cluster attached
        run: |
          set -euo pipefail
          # --network host: the kind API server listens on 127.0.0.1
          docker run -d --name sl-cluster --network host -e PORT=8081 \
            -e KUBECONFIG_B64="$(base64 -w0 "${RUNNER_TEMP}/demo.kubeconfig")" starling-lite:ci
          python3 scripts/ci/starling-lite-smoke.py --url http://127.0.0.1:8081 --revision "${GITHUB_SHA}" --wait 60 --require-cluster
          # Outside the demo namespaces, ConfigMaps stay unreadable.
          body='{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"get_configmap","arguments":{"namespace":"kube-system","name":"kube-proxy"}}}'
          curl -fsS -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8081/mcp \
            | python3 -c 'import json,sys; r=json.load(sys.stdin)["result"]; t=r["content"][0]["text"]; assert r.get("isError") and "forbidden" in t, r; print("refused:", t[:120])'

      - name: Container logs
        if: always()
        run: |
          docker logs sl 2>&1 | tail -n 50 || true
          docker logs sl-cluster 2>&1 | tail -n 50 || true

  deploy:
    name: Deploy to Railway (production)
    needs: image
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.MCP_URL || 'https://mcp.warbleoss.org' }}
    concurrency:
      group: railway-production-starling-lite
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      MCP_URL: ${{ vars.MCP_URL || 'https://mcp.warbleoss.org' }}
    steps:
      - name: Check deploy configuration
        run: |
          ok=1
          [ -n "${RAILWAY_TOKEN}" ]   || { echo "::error::secret RAILWAY_TOKEN is not set (Railway project token, production environment)"; ok=0; }
          [ -n "${RAILWAY_SERVICE}" ] || { echo "::error::variable RAILWAY_SERVICE is not set (Railway service name of Starling Lite)"; ok=0; }
          [ "$ok" = 1 ]

      # The Dockerfile copies heron-ops/ and shrikeops/, so the upload needs the submodules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ vars.CI_USE_PAT == 'true' && secrets.WARBLE_CI_PAT || github.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install -g "@railway/cli@${RAILWAY_CLI_VERSION}" && railway --version

      - name: Stamp revision
        run: echo "${GITHUB_SHA}" > deploy/railway/REVISION

      - name: railway up
        # Project token => project + environment are implied; builds with railway.toml
        # (deploy/railway/Dockerfile). --ci streams build logs and fails if the build fails.
        run: railway up --ci --service "${RAILWAY_SERVICE}" --message "starling-lite ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"

      - name: Smoke test production
        # Waits up to 10 min for Railway's healthcheck + switchover, then requires /health to
        # report this commit, tools/list, a complete scan_manifest and a real-container proposal.
        run: python3 scripts/ci/starling-lite-smoke.py --url "${MCP_URL}" --revision "${GITHUB_SHA}" --wait 600

name: release

# Builds, signs and publishes the assets for one tagged release.
# Process and verification: docs/RELEASING.md.
#
#   starling-lite-vX.Y.Z  binaries (linux/darwin/windows x amd64/arm64), SPDX SBOMs,
#                         starling-ex-ce chart .tgz, multi-arch image
#                         ghcr.io/warbletech/warble-army/starling-lite:X.Y.Z
#   warble-army-vX.Y.Z    source archive + SBOM
#
# Every release gets <component>_<version>_checksums.txt, a keyless cosign
# bundle for it (*.sigstore.json) and SLSA build provenance (*.intoto.jsonl,
# also stored as a GitHub artifact attestation).
#
# Triggers:
#   workflow_call      from release-please.yml right after it creates the release
#   push (tags)        a maintainer pushes a tag by hand (fallback path)
#   workflow_dispatch  rebuild / re-upload for an existing tag
#   pull_request       dry run: build only; nothing is pushed, signed or uploaded
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, e.g. starling-lite-v0.4.0"
        required: true
        type: string
  push:
    tags:
      - "starling-lite-v*"
      - "warble-army-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. starling-lite-v0.4.0"
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-please.yml"
      - "scripts/release/**"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - "deploy/agentgateway/Dockerfile.starling-lite"

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/warbletech/warble-army/starling-lite

jobs:
  prepare:
    name: resolve tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      component: ${{ steps.tag.outputs.component }}
      version: ${{ steps.tag.outputs.version }}
      ref: ${{ steps.tag.outputs.ref }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            # Dry run of the starling-lite path against the PR head, placeholder version.
            {
              echo "tag=starling-lite-v0.0.0-dryrun"
              echo "component=starling-lite"
              echo "version=0.0.0-dryrun"
              echo "ref=${GITHUB_SHA}"
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=${INPUT_TAG:-$REF_NAME}
          if [[ "$tag" =~ ^(starling-lite|warble-army)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            component=${BASH_REMATCH[1]}; version=${BASH_REMATCH[2]}
          else
            echo "::error::tag '$tag' is not starling-lite-vX.Y.Z or warble-army-vX.Y.Z"; exit 1
          fi
          {
            echo "tag=$tag"
            echo "component=$component"
            echo "version=$version"
            echo "ref=refs/tags/$tag"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"
          echo "### $tag" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ needs.prepare.outputs.component }} ${{ needs.prepare.outputs.version }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          # starling-lite builds against the heron-ops and shrikeops submodules (go.mod replace).
          submodules: ${{ needs.prepare.outputs.component == 'starling-lite' && 'recursive' || 'false' }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.prepare.outputs.component == 'starling-lite'
        with:
          go-version-file: mcp/starling-lite/go.mod
          cache-dependency-path: mcp/starling-lite/go.sum

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        if: needs.prepare.outputs.component == 'starling-lite'
        with:
          version: v3.16.4

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.1

      - name: Build assets
        env:
          COMPONENT: ${{ needs.prepare.outputs.component }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release/build-artifacts.sh "$COMPONENT" "$VERSION" dist

      - name: Smoke the linux/amd64 binary
        if: needs.prepare.outputs.component == 'starling-lite'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke
          tar -xzf "dist/starling-lite_${VERSION}_linux_amd64.tar.gz" -C /tmp/smoke
          out=$("/tmp/smoke/starling-lite_${VERSION}_linux_amd64/starling-lite" --version)
          echo "$out"
          case "$out" in *" ${VERSION} "*) ;; *) echo "::error::binary does not report ${VERSION}"; exit 1 ;; esac

      - name: Summary
        run: |
          { echo '```'; cat dist/*_checksums.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  image:
    name: image ${{ needs.prepare.outputs.version }}
    needs: prepare
    if: needs.prepare.outputs.component == 'starling-lite'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write # push the image to GHCR (dry runs do not push)
      id-token: write # keyless cosign signature + provenance (Sigstore / GitHub OIDC)
      attestations: write # GitHub artifact attestation for the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive
          persist-credentials: false

      - id: rev
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/agentgateway/Dockerfile.starling-lite
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ steps.rev.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.revision }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=starling-lite
          provenance: false
          sbom: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: needs.prepare.outputs.publish == 'true'
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: needs.prepare.outputs.publish == 'true'
        with:
          syft-version: v1.57.1

      - name: Sign image and attach SBOM (keyless)
        if: needs.prepare.outputs.publish == 'true'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$REF"
          syft scan --quiet "registry:$REF" -o spdx-json=image.spdx.json
          cosign attest --yes --type spdxjson --predicate image.spdx.json "$REF"
          echo "Image: \`$REF\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.prepare.outputs.publish == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  sign:
    name: sign
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # keyless cosign signature + provenance (Sigstore / GitHub OIDC)
      attestations: write # GitHub artifact attestation for the release assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign checksums (keyless cosign bundle)
        env:
          COMPONENT: ${{ needs.prepare.outputs.component }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c "${COMPONENT}_${VERSION}_checksums.txt"
          cosign sign-blob --yes --bundle "${COMPONENT}_${VERSION}_checksums.txt.sigstore.json" \
            "${COMPONENT}_${VERSION}_checksums.txt"

      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/${{ needs.prepare.outputs.component }}_${{ needs.prepare.outputs.version }}_checksums.txt

      - name: Export provenance as in-toto JSONL
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          COMPONENT: ${{ needs.prepare.outputs.component }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # The DSSE envelope from the Sigstore bundle, one per line (the SLSA *.intoto.jsonl layout).
          jq -c '.dsseEnvelope' "$BUNDLE" > "dist/${COMPONENT}_${VERSION}.intoto.jsonl"
          cp "$BUNDLE" "dist/${COMPONENT}_${VERSION}.provenance.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: upload to GitHub Release
    needs: [prepare, sign]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release (tag-push path) and upload assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Tag pushed by hand: release-please did not create a release, so make one.
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[].name)'

name: release-please

# Manual for now (see docs/RELEASING.md). Switch to `push: branches: [main]`
# once maintainers agree and "Allow GitHub Actions to create and approve pull
# requests" is enabled for the repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    if: github.repository == 'warbletech/warble-army'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # release commits and tags
      pull-requests: write # open the release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

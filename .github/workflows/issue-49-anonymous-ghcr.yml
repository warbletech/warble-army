name: Issue 49 anonymous GHCR pull

# Temporary check for warbletech/warble-army#49.
# A public GitHub-hosted runner resolves main and pulls
# ghcr.io/warbletech/warble-army/starling-lite:<sha> with no registry login.
# This workflow must not gain GHCR credentials, PATs, or package write.

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  anonymous-pull:
    name: anonymous starling-lite pull
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pull starling-lite anonymously and print version
        run: |
          set -euo pipefail
          docker logout ghcr.io
          SHA=$(git ls-remote https://github.com/warbletech/warble-army refs/heads/main | cut -f1)
          echo "SHA=$SHA"
          if [ -z "$SHA" ]; then
            echo "::error::git ls-remote did not return a SHA for refs/heads/main"
            exit 1
          fi
          docker pull "ghcr.io/warbletech/warble-army/starling-lite:$SHA"
          version=$(docker run --rm "ghcr.io/warbletech/warble-army/starling-lite:$SHA" --version)
          echo "version=$version"
          printf '%s\n' "$version"

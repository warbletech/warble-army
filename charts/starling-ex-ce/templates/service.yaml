apiVersion: v1
kind: Service
metadata:
  name: {{ include "starling-ex-ce.fullname" . }}
  labels:
    {{- include "starling-ex-ce.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "starling-ex-ce.selectorLabels" . | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.service.port }}
      targetPort: mcp

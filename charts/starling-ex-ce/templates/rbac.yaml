{{- if and .Values.serviceAccount.create .Values.serviceAccount.clusterRole }}
# Heron Ops cluster tools (read-only by default)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "starling-ex-ce.fullname" . }}-heron-ops
  labels:
    {{- include "starling-ex-ce.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "pods/log", "nodes", "events", "services", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "starling-ex-ce.fullname" . }}-heron-ops
  labels:
    {{- include "starling-ex-ce.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "starling-ex-ce.fullname" . }}-heron-ops
subjects:
  - kind: ServiceAccount
    name: {{ include "starling-ex-ce.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

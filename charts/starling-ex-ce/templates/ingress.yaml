{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "starling-ex-ce.fullname" . }}
  labels:
    {{- include "starling-ex-ce.labels" . | nindent 4 }}
  annotations:
    {{- if not .Values.ingress.auth.enabled }}
    {{- fail "ingress.auth.enabled must stay true when ingress.enabled is true" }}
    {{- end }}
    {{- range $k, $v := .Values.ingress.annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/auth-url: {{ required "ingress.auth.url is required when ingress is enabled. Point it at oauth2-proxy /oauth2/auth or another forward-auth endpoint." .Values.ingress.auth.url | quote }}
    {{- with .Values.ingress.auth.signin }}
    nginx.ingress.kubernetes.io/auth-signin: {{ . | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/auth-response-headers: {{ .Values.ingress.auth.responseHeaders | quote }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | quote }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "starling-ex-ce.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
